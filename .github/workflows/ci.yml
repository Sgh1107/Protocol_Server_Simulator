#
# P0 CI：Windows 构建 + 测试；Linux 只做编译守卫（AC-P0-19）。
# Linux 作业不要求功能通过，唯一目的是尽早暴露 Win32 API 渗入 sim-core。

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  QT_VERSION: "6.6.3"

jobs:
  windows:
    name: Windows x64 (MSVC 2022)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2019_64
          cache: true

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPROTOSIM_WERROR=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Selftest
        run: ./build/bin/ProtoSim.exe --selftest

  linux-guard:
    name: Linux compile guard
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: Desktop
          arch: linux_gcc_64
          cache: true

      # 守卫作业：只要能编过，说明 sim-core / adapters 里没有 Win32 专有 API。
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPROTOSIM_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build --parallel

  format:
    name: clang-format
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Check formatting
        run: |
          find sim-core adapters ui app tests -name '*.cpp' -o -name '*.h' 2>/dev/null \
            | xargs -r clang-format --dry-run --Werror
