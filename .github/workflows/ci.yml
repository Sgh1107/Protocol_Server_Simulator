#
# CI：只守 Windows x64 + MSVC。
#
# 项目定位是 Windows 桌面联调工具（README §2），Linux 版本待 P0 之后单独立项，
# 因此 P0 阶段**不设 Linux 编译守卫**；也**不设格式门禁**——格式靠 .clang-format
# 与评审保证，不值得为几十处排版差异反复烧 CI 分钟。
#
# 这个作业守三件事：
#   1. 干净环境能从零配置 + 编译（-DPROTOSIM_WERROR=ON，警告当错误）
#   2. 三层测试里的 L1 + L2 全绿
#   3. --selftest 九项在 CI 机器上也能过

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows x64 (MSVC 2022)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      # 两个关键点：
      # 1) runner 的 PATH 里有 MinGW 的 c++.exe，用 VS 生成器锁死 MSVC，
      #    比"Ninja + msvc-dev-cmd"少一层对 PATH 顺序的依赖；
      # 2) modules 必须显式给 qtserialbus —— aqt 的 --autodesktop 默认只装
      #    qtbase/qtdeclarative/qttools/qtsvg，没有 SerialBus，find_package 必失败。
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.6.3"
          arch: win64_msvc2019_64
          modules: qtserialbus
          cache: true

      - name: Configure
        run: >
          cmake -S . -B build
          -G "Visual Studio 17 2022" -A x64
          -DPROTOSIM_WERROR=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Selftest
        run: ./build/bin/ProtoSim.exe --selftest
